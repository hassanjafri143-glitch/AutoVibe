name: Build APK and publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      KEYSTORE_PATH: ${{ github.workspace }}/ci-release-key.jks
      STORE_PASSWORD: autovibe-ci-pass
      KEY_PASSWORD: autovibe-ci-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signing keystores
        run: |
          # build.gradle.kts expects alias "upload" for release and debug.keystore in the project root
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=AutoVibe, OU=Dev, O=AutoVibe, L=Lahore, C=PK"
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AutoVibe.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoVibe-apk
          path: AutoVibe.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AutoVibe.apk --clobber
          else
            gh release create "$TAG" AutoVibe.apk \
              --title "AutoVibe $TAG" \
              --notes "Android APK (Android 7.0+). See README for install steps."
          fi
